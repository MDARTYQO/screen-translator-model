name: Fetch sentence-transformer model

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Hugging Face model (sentence-transformers format)"
        default: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
        required: true

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install huggingface_hub

      - name: Download and split model
        env:
          MODEL: ${{ inputs.model }}
        run: |
          python - <<'PY'
          import os, shutil, math
          from pathlib import Path
          from huggingface_hub import snapshot_download

          model_id = os.environ["MODEL"]
          branch = "st-model-" + model_id.split("/")[-1]

          print(f"Downloading {model_id} ...")
          snapshot_download(repo_id=model_id, local_dir="model")

          out = Path("out")
          out.mkdir()

          SPLIT_SIZE = 40 * 1024 * 1024  # 40MB

          for src in Path("model").rglob("*"):
              if not src.is_file():
                  continue
              rel = src.relative_to("model")
              if src.stat().st_size > SPLIT_SIZE:
                  # split large file
                  dest_dir = out / rel.parent
                  dest_dir.mkdir(parents=True, exist_ok=True)
                  data = src.read_bytes()
                  total = math.ceil(len(data) / SPLIT_SIZE)
                  for i in range(total):
                      chunk = data[i*SPLIT_SIZE:(i+1)*SPLIT_SIZE]
                      (dest_dir / f"{rel.name}.part{i:03d}").write_bytes(chunk)
                  print(f"Split {rel} into {total} parts")
              else:
                  dest = out / rel
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(src, dest)

          (out / "SOURCE").write_text(model_id)
          print("Done. Files in out/:")
          for f in sorted(out.rglob("*")):
              if f.is_file():
                  print(f"  {f.relative_to(out)} ({f.stat().st_size:,} bytes)")

          Path("branch_name.txt").write_text(branch)
          PY

      - name: Publish to branch
        run: |
          BRANCH=$(cat branch_name.txt)
          cd out
          git init -q
          git checkout -q -b "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Model $BRANCH"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/$BRANCH"
          echo "Published to branch: $BRANCH"
