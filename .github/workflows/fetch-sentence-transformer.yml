name: Fetch sentence-transformer model

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Hugging Face model (sentence-transformers format)"
        default: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
        required: true

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Git LFS
        run: git lfs install

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install huggingface_hub

      - name: Download model
        env:
          MODEL: ${{ inputs.model }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          model_id = os.environ["MODEL"]
          print(f"Downloading {model_id} ...")
          snapshot_download(repo_id=model_id, local_dir="out")
          PY
          ls -la out/

      - name: Publish to branch
        env:
          MODEL: ${{ inputs.model }}
        run: |
          BRANCH="st-model-$(basename "$MODEL")"
          cd out
          git init -q
          git lfs install
          git lfs track "*.safetensors" "*.bin"
          git add .gitattributes
          git checkout -q -b "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Model $MODEL"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/$BRANCH"
          echo "Published to branch: $BRANCH"
